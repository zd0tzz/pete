<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Change your page title here -->
    <title>Numbskulls Test VM</title>
    <!-- Replace with your own favicon -->
    <link id="favicon" rel="icon" type="image/webp" href="my-logo.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <section id="splash" aria-live="polite">
      <header class="top-nav">
        <div class="nav-left">
          <!-- Your Custom Brand orLogo in the top left -->
          <a
            class="nav-brand-label"
            href="/"
            aria-label="My Project"
          >
            Numbskull's Custom Browser <span class="labs-badge">App</span>
          </a>
        </div>
      </header>
      
      <main class="stage">
        <div id="splash-shell" class="stage-inner" data-phase="loading">
          
          <!-- Your Main Headline -->
          <h1 id="project-title" class="splash-title">Numbskull's VM</h1>
          <!-- Your Subheadline -->
          <p class="project-copy">
            A personalized, private web browsing experience.<br />
            Running completely inside your current browser tab.
          </p>

          <div id="stage-card" class="launch-panel" data-phase="loading">
            <div class="panel-loading" aria-label="Loading Browser">
              <div
                class="progress-track"
                role="progressbar"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
              >
                <div id="progress-fill" class="progress-fill"></div>
              </div>
              <div class="progress-meta">
                <span id="progress-phase">Preparing</span>
                <span id="progress-percent"></span>
              </div>
              <p id="splash-status" class="splash-status">Preparing Engine…</p>
            </div>

            <div class="panel-ready" aria-label="Launch">
              <button id="start-btn" type="button" class="start-btn">
                Launch Browser
              </button>
              <p id="jspi-note" class="jspi-note" hidden></p>
              <details class="advanced">
                <summary>Advanced options</summary>
                <div class="splash-controls">
                  <label class="option-card">
                    <input type="checkbox" id="opt-gpu" />
                    <span class="option-copy">
                      <strong>GPU acceleration</strong>
                      <span>WebGL-based rendering for web content.</span>
                    </span>
                  </label>
                  <label class="option-card">
                    <input type="checkbox" id="opt-jit" />
                    <span class="option-copy">
                      <strong>Enable JIT</strong>
                      <span>Experimental JS → WASM JIT. Expect bugs.</span>
                    </span>
                  </label>
                  <label class="wisp-field">
                    <span>Wisp server</span>
                    <span class="wisp-copy">
                      WebSocket proxy that tabs load web content through.
                    </span>
                    <input
                      type="text"
                      id="opt-wisp"
                      spellcheck="false"
                      autocomplete="off"
                      aria-label="Wisp server"
                    />
                  </label>
                </div>
              </details>
            </div>
          </div>

          <section class="startup-console" aria-label="Startup console">
            <p class="phase-kicker">Startup log</p>
            <div
              id="console-output"
              class="console-box"
              role="log"
              aria-label="Startup console output"
            ></div>
          </section>
        </div>

        <!-- Updated Powered By Badge -->
        <a
          class="powered-badge"
          href="https://github.com/HeyPuter/firefox-wasm"
          target="_blank"
          rel="noreferrer"
        >
          <span class="powered-dot" aria-hidden="true"></span>
          Powered by <strong>Puter's Firefox in WASM</strong>
        </a>
      </main>
    </section>
    
    <!-- The canvas where the WASM engine actually renders -->
    <canvas id="screen" width="1024" height="768" tabindex="0"></canvas>
    
    <!-- Bootstrapper script -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
